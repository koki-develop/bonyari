<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="疲れたときに、ぼーっと眺める小さな作品集。" />
    <title>bonyari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/shared/base.css" />
    <link rel="stylesheet" href="/src/top/style.css" />
  </head>
  <body>
    <main class="collection">
      <header class="collection-header">
        <h1>bonyari</h1>
        <p>疲れたときに、ぼーっと眺める小さな作品集。</p>
      </header>
      <ul class="works">
        <li>
          <a class="work" href="train-window/">
            <img class="work-thumb" src="thumbs/train-window.png" alt="" width="320" height="180" />
            <span class="work-title">車窓</span>
            <span class="work-desc"
              >列車の窓から見る景色。季節と時間が、ゆっくり流れていきます。</span
            >
          </a>
        </li>
        <li>
          <a class="work" href="kyudo/">
            <img class="work-thumb" src="thumbs/kyudo.png" alt="" width="320" height="180" />
            <span class="work-title">弓道場</span>
            <span class="work-desc"
              >射位に立って、ゆっくり弓を引く。放った矢は、そのまま的に残ります。</span
            >
          </a>
        </li>
        <li>
          <a class="work" href="ant-nest/">
            <img class="work-thumb" src="thumbs/ant-nest.png" alt="" width="320" height="180" />
            <span class="work-title">アリの巣</span>
            <span class="work-desc"
              >一匹の女王から始まるアリの巣を、土の断面で眺める。季節がめぐり、巣が育っていきます。</span
            >
          </a>
        </li>
        <li>
          <a class="work" href="settlement/">
            <img class="work-thumb" src="thumbs/settlement.png" alt="" width="320" height="180" />
            <span class="work-title">開拓村</span>
            <span class="work-desc"
              >森を切り開いた小さな村が、城壁に囲まれた町へ育っていく。ときどき魔物が襲ってきます。</span
            >
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
