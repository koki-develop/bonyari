<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="列車の車窓を、ぼーっと眺めるドット絵の小品。" />
    <title>車窓 — spaceout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="view" aria-label="列車の窓から見える景色"></canvas>

    <button id="start" class="start" type="button">
      <span class="start-title">車窓</span>
      <span class="start-board">タップして乗車</span>
      <span class="start-note">音が出ます</span>
    </button>

    <nav id="hud" class="hud" hidden>
      <a class="hud-button" href="../" aria-label="作品一覧へ戻る">
        <svg viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges">
          <path d="M5 2h1v1H5zM4 3h1v1H4zM3 4h5v2H3zM4 6h1v1H4zM5 7h1v1H5z" />
        </svg>
      </a>
      <button
        id="light"
        class="hud-button"
        type="button"
        aria-pressed="true"
        aria-label="車内灯を消す"
      >
        <svg viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges">
          <path d="M3 1h4v1H3zM2 2h1v3H2zM7 2h1v3H7zM3 5h1v1H3zM6 5h1v1H6zM4 6h2v1H4zM4 8h2v1H4z" />
          <path class="glow" d="M3 2h4v3H3zM4 5h2v1H4z" />
        </svg>
      </button>
      <button id="sound" class="hud-button" type="button" aria-pressed="true" aria-label="音を消す">
        <svg viewBox="0 0 10 10" aria-hidden="true" shape-rendering="crispEdges">
          <path d="M1 4h2v2H1zM3 3h1v4H3zM4 2h1v6H4z" />
          <path class="waves" d="M6 4h1v2H6zM8 3h1v4H8zM7 2h1v1H7zM7 7h1v1H7z" />
          <path class="muted" d="M6 3h1v1H6zM8 3h1v1H8zM7 4h1v2H7zM6 6h1v1H6zM8 6h1v1H8z" />
        </svg>
      </button>
    </nav>

    <script type="module" src="/src/train-window/main.ts"></script>
  </body>
</html>
